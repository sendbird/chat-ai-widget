version: 2.1
orbs:
  aws-cli: circleci/aws-cli@5.1.1
  aws-s3: circleci/aws-s3@4.1.0

parameters:
  run_deploy_prod:
      type: boolean
      default: false

executors:
  ci-aws:
    docker:
      - image: cimg/aws:2024.03
    resource_class: small
  node:
    docker:
      - image: cimg/node:20.13.1
    resource_class: medium
  ci-node:
    docker:
      - image: cimg/node:20.13.1
    resource_class: medium
    working_directory: ~/project
  ci-macos:
    macos:
      xcode: 15.0.0  # Use the closest available version of macOS (Sonoma equivalent may not be available yet)
    working_directory: ~/project

commands:
  attach_project:
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Enable Corepack
          command: corepack enable --install-directory ~/bin
  aws-create-invalidation:
    description: Create invalidation in CloudFront distribution
    parameters:
      distribution-id:
        default: default
        description: Distribution id for CloudFront
        type: string
      paths:
        default: /
        description: Target paths for invalidation
        type: string
      profile:
        default: default
        description: AWS profile name
        type: string
    steps:
      - run:
          command: |
            echo "Create invalidation in CloudFront"
            aws cloudfront create-invalidation \
                --distribution-id <<parameters.distribution-id>> \
                --paths <<parameters.paths>> --profile <<parameters.profile>>

jobs:
  # CI - install dependencies
  prepare:
    executor: ci-node
    steps:
      - checkout
      - attach_project
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "yarn.lock" }}
            - v2-dependencies-
      - run:
          name: Install dependencies
          command: |
            git submodule update --init --recursive
            yarn install --immutable
      - save_cache:
          key: v2-dependencies-{{ checksum "yarn.lock" }}
          paths:
            - node_modules
            - packages/self-service/node_modules
      - persist_to_workspace:
          root: .
          paths: .

  # CI - install dependencies for macOS
  prepare-macos:
    executor: ci-macos
    steps:
      - checkout
      - attach_workspace:
          at: /Users/distiller/project
      - run:
          name: Install dependencies
          command: |
            git submodule update --init --recursive
            yarn install --immutable
      - save_cache:
          key: v2-dependencies-{{ checksum "yarn.lock" }}
          paths:
            - node_modules
            - packages/self-service/node_modules
      - persist_to_workspace:
          root: /Users/distiller/project
          paths: .

  # CI - check format
  run-format:
    executor: ci-node
    steps:
      - attach_project
      - run:
          name: Run lint and prettier check
          command: yarn format:check
  # CI - check build
  run-build:
    executor: ci-node
    steps:
      - attach_project
      - run:
          name: Run build
          # command: yarn build
          command: sh scripts/build-check-ci.sh
  # CI - check test
  run-test:
    executor: ci-node
    steps:
      - attach_project
      - run:
          no_output_timeout: 15m
          name: Run test
          command: yarn test
  # CI - Run snapshot tests
  run-snapshot-test:
    executor: ci-macos
    steps:
      - attach_project
      - run:
          name: Clean and reinstall dependencies
          command: |
            rm -rf node_modules package-lock.json
            yarn install
      - run:
          name: Install Playwright dependencies
          command: sudo yarn playwright install-deps
      - run:
          name: Install Playwright browsers
          command: yarn playwright install
      - run:
          name: List all __visual_tests__ snapshots
          command: find /Users/distiller/project/__visual_tests__ -type f
      - run:
          name: Run Playwright snapshot tests
          command: yarn playwright test
      - store_artifacts:
          path: /Users/distiller/project/test-results
          destination: playwright-test-results

  # Publish - build self-service
  build:
    executor: node
    parameters:
      widget_version:
        type: string
    steps:
      - checkout
      - run:
          name: Enable Corepack
          command: corepack enable --install-directory ~/bin
      - run:
          name: install dependencies and build
          command: |
            cd ./packages/self-service
            npm install
            npm run build version=<< parameters.widget_version >>
#            TODO: update self-service to use yarn workspaces
#            yarn install --immutable --immutable-cache
#            yarn build
      - run:
          name: Set default widget version
          command: |
            VERSION=v$(node -p "require('./package.json').version")
            echo "export WIDGET_VERSION=$VERSION" >> $BASH_ENV
            cp $BASH_ENV ./packages/self-service/widget.env
      - persist_to_workspace:
          root: ./packages/self-service
          paths:
            - dist
            - widget.env
  # Publish - upload self-service to S3 and invalidate cache
  upload_to_s3_and_invalidate_cache:
    executor: ci-aws
    parameters:
      s3_bucket:
        type: string
      distribution_id:
        type: string
      role_arn:
        type: string
      widget_version:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Load environment variables
          command: |
            cat widget.env >> $BASH_ENV
      - aws-cli/setup:
          role_arn: ${AWS_ID_ROLE_ARN}
          region: us-east-1
          profile_name: aws-id
      - aws-cli/role_arn_setup:
          profile_name: ci-web
          source_profile: aws-id
          role_arn: << parameters.role_arn >>
      - aws-s3/sync:
          from: dist/
          to: << parameters.s3_bucket >>
          profile_name: ci-web
      - aws-s3/copy:
          arguments: '--metadata-directive REPLACE --cache-control "max-age=86400" --content-type application/javascript --recursive'
          from: << parameters.s3_bucket >>/<< parameters.widget_version >>
          to: << parameters.s3_bucket >>/<< parameters.widget_version >>
          profile_name: ci-web
      - aws-s3/copy:
          arguments: '--metadata-directive REPLACE --cache-control "max-age=0" --content-type application/javascript'
          from: << parameters.s3_bucket >>/index.js
          to: << parameters.s3_bucket >>/index.js
          profile_name: ci-web
      - aws-s3/copy:
          arguments: '--metadata-directive REPLACE --cache-control "max-age=86400" --content-type text/html'
          from: << parameters.s3_bucket >>/playground/index.html
          to: << parameters.s3_bucket >>/playground/index.html
          profile_name: ci-web
      - aws-create-invalidation:
          distribution-id: << parameters.distribution_id >>
          paths: '"/index.js" "/playground/*"'
          profile: ci-web

workflows:
  ci:
    jobs:
      - prepare
      - run-format:
          requires:
            - prepare
      - run-build:
          requires:
            - prepare
      - run-test:
          requires:
            - prepare
  ci-snapshot-test:
    jobs:
      - prepare-macos
      - run-snapshot-test:
          requires:
            - prepare-macos

  deploy_prod:
    when: << pipeline.parameters.run_deploy_prod >>
    jobs:
      - build:
          name: build
          widget_version: ""
          filters: &default_branch_trigger
            branches:
              only:
                - develop
      - upload_to_s3_and_invalidate_cache:
          name: upload_to_s3_and_invalidate_cache
          filters: *default_branch_trigger
          s3_bucket: $S3_BUCKET
          distribution_id: $DISTRIBUTION_ID
          role_arn: $ROLE_ARN
          widget_version: $WIDGET_VERSION
          requires:
            - build
          context:
            - circleci-dashboard-bot

  deploy_stg:
    jobs:
      - build:
          name: build_staging
          widget_version: $CIRCLE_TAG
          filters: &only_version_tag_trigger_staging
            tags:
              only: /^v\d+\.\d+\.\d+-staging(\.\d+)?$/
            branches:
              ignore: /.*/
      - upload_to_s3_and_invalidate_cache:
          name: upload_to_s3_and_invalidate_cache_staging
          filters: *only_version_tag_trigger_staging
          s3_bucket: $S3_BUCKET_STAGING
          distribution_id: $DISTRIBUTION_ID_STAGING
          role_arn: $ROLE_ARN_STAGING
          widget_version: $CIRCLE_TAG
          requires:
            - build_staging
          context:
            - circleci-dashboard-bot
